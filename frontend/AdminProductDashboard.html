<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Exclusive</title>
    <link rel="stylesheet" href="admin-product-dashboard.css">
</head>
<body>
    <div class="header">
        <div class="logo">Exclusive</div>
        <div class="header-right">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
            <button class="logout-btn" onclick="logout()">LOGOUT</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="sidebar">
            <div class="sidebar-item">
                <svg class="sidebar-icon" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                DASHBOARD
            </div>
            <div class="sidebar-item active" >
                <svg class="sidebar-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 7h-9v2h9V7zM20 15h-9v2h9v-2zM4 17h4v-4H4v4zM4 7h4V3H4v4z"></path>
                </svg>
                ALL PRODUCTS
            </div>
            <div class="sidebar-item">
                <svg class="sidebar-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"></path>
                    <polyline points="14,2 14,8 20,8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10,9 9,9 8,9"></polyline>
                </svg>
                ORDER LIST
            </div>

            <div class="categories">
                <div class="categories-header">
                    Categories
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
                <div class="category-item">
                    Samsung
                    <span class="category-count">21</span>
                </div>
                <div class="category-item">
                    Iphone
                    <span class="category-count">32</span>
                </div>
                <div class="category-item">
                    MacBook
                    <span class="category-count">13</span>
                </div>
                <div class="category-item">
                    Mi NoteBook
                    <span class="category-count">14</span>
                </div>
                <div class="category-item">
                    MateBook
                    <span class="category-count">06</span>
                </div>
                <div class="category-item">
                    GalaxyBook
                    <span class="category-count">11</span>
                </div>
            </div>
        </div>

        <div class="content">
            <div class="content-header">
                <div>
                    <div class="breadcrumb">
                        <a href="#">Home</a> > All Products
                    </div>
                    <h1 class="page-title">All Products</h1>
                </div>
                <button class="add-product-btn" onclick="window.location.href='AdminAddProduct.html'">
                    ADD NEW PRODUCT
                </button>
            </div>

            <div class="products-grid" id="productsGrid">
                <!-- Products will be generated by JavaScript -->
            </div>

            <div class="pagination">
                <button onclick="changePage('prev')" id="prevBtn">‹</button>
                <button class="active" onclick="changePage(1)">1</button>
                <button onclick="changePage(2)">2</button>
                <button onclick="changePage(3)">3</button>
                <button onclick="changePage(4)">4</button>
                <span>...</span>
                <button onclick="changePage(10)">10</button>
                <button onclick="changePage('next')" id="nextBtn">NEXT ›</button>
            </div>
        </div>
    </div>

    <script>
        let products = [];
        let currentPage = 1;
        let totalPages = 1;
        const limit = 6; // products per page

        async function fetchProducts(page = 1) {
            try {
                const res = await fetch(`http://localhost:8000/api/products?page=${page}&limit=${limit}`);
                if (!res.ok) throw new Error("Failed to fetch products");

                const data = await res.json();

                products = data.data; // array of products from backend
                currentPage = data.pagination.page;
                totalPages = data.pagination.pages;

                generateProductCards();
                renderPagination();
            } catch (err) {
                console.error(err);
            }
        }

        function generateProductCards() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            products.forEach(product => {
                const card = document.createElement('div');
                card.setAttribute("onclick", `window.location.href='AdminProductDetail.html?id=${product.id}'`)
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-header">
                        <div class="product-info">
                            <h3>${product.name}</h3>
                            <div class="product-brand">${product.sku || 'N/A'}</div>
                            <div class="product-price">$${product.sale_price}</div>
                        </div>
                        <button class="more-btn">⋯</button>
                    </div>
                    <div class="product-image">
                        <img src="${product.images?.[0]?.path || 'placeholder.jpg'}" alt="${product.name}">
                    </div>
                    <div class="product-summary">
                        <h4>Summary</h4>
                        <p>${product.description || 'No description available'}</p>
                    </div>
                    <div class="product-stats">
                        
                        <div class="stat-row">
                            <span class="stat-label">Remaining Products</span>
                            <div class="stat-value">
                                <span>${product.quantity}</span>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderPagination() {
            const pagination = document.querySelector('.pagination');
            pagination.innerHTML = '';

            // Prev button
            const prevBtn = document.createElement('button');
            prevBtn.textContent = '‹';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => changePage(currentPage - 1);
            pagination.appendChild(prevBtn);

            // Page buttons
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    const btn = document.createElement('button');
                    btn.textContent = i;
                    if (i === currentPage) btn.classList.add('active');
                    btn.onclick = () => changePage(i);
                    pagination.appendChild(btn);
                } else if (i === 2 && currentPage > 3 || i === totalPages - 1 && currentPage < totalPages - 2) {
                    const dots = document.createElement('span');
                    dots.textContent = '...';
                    pagination.appendChild(dots);
                }
            }

            // Next button
            const nextBtn = document.createElement('button');
            nextBtn.textContent = '›';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => changePage(currentPage + 1);
            pagination.appendChild(nextBtn);
        }

        function changePage(page) {
            if (page >= 1 && page <= totalPages) {
                fetchProducts(page);
            }
        }
        function logout() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = 'Login.html';
            
        }

        // Load first page
        fetchProducts(1);
    </script>
</body>
</html>
