<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Exclusive</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <header>
    <div class="logo">Exclusive</div>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Shop</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
    <div class="search-bar">
      <input type="text" placeholder="What are you looking for?">
      <button>🔍</button>
    </div>
  </header>

  <main class="container">
    <div class="left-panel">
      <!-- Hình -->
      <div class="overlay">
        <h3>New to our website?</h3>
        <button class="create-btn" onclick="window.location.href='Register.html'">CREATE AN ACCOUNT</button>
      </div>
    </div>

    <div class="right-panel login-form">
      <h2>Log In</h2>
      <p>Enter your details below</p>
      <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" class="login-btn">Log In</button>
    </form>
    </div>
  </main>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const response = await fetch("http://localhost:8000/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        if (response.ok) {
            const data = await response.json();
            localStorage.setItem("access_token", data.access_token); // Save token
            localStorage.setItem("role", data.role);
            if (data.role == "admin") {
                window.location.href = "AdminProductDashboard.html";
            } else {
                window.location.href = "ProductList.html";
            }
        } else {
            alert("Invalid email or password");
        }
    });
    </script>
  </body>
</html>
