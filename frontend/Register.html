<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Account - Exclusive</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <header>
    <div class="logo">Exclusive</div>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Shop</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
    <div class="search-bar">
      <input type="text" placeholder="What are you looking for?">
      <button>🔍</button>
    </div>
  </header>

  <main class="container">
    <div class="left-panel">
      <h2>Create an account</h2>
      <p>Enter your details below</p>
      <form id="registerForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="password" id="repeat-password" placeholder="Confirm password" required>
        <button type="submit" class="create-btn">Create Account</button>
      </form>
    </div>

    <div class="right-panel">
      <div class="overlay">
        <h3>Already have an account?</h3>
        <button class="login-btn" onclick="window.location.href='Login.html'">LOGIN</button>
      </div>
    </div>
  </main>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const repeat_password = document.getElementById("repeat-password").value.trim();

      if (password !== repeat_password) {
        alert("Passwords do not match");
        return;
      }

      let res = await fetch("http://localhost:8000/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      if (!res.ok) {
        alert("Registration failed. Email might already be used.");
        return;
      }
      alert("Registered successfully, processing to login...")
      window.location.href = "Login.html";

      
    });
  </script>
</body>
</html>
