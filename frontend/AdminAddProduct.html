</head>
<body>
    <div class="header">

            </svg>

    </div>

    <div class="main-layout">
        <div class="sidebar">
            <div class="sidebar-item">
                <svg class="sidebar-icon" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                DASHBOARD
            </div>
            <div class="sidebar-item active" onclick="window.location.href='AdminProductDashboard.html'">
                <svg class="sidebar-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 7h-9v2h9V7zM20 15h-9v2h9v-2zM4 17h4v-4H4v4zM4 7h4V3H4v4z"></path>
                </svg>
                ALL PRODUCTS
            </div>
            <div class="sidebar-item">
                <svg class="sidebar-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"></path>
                    <polyline points="14,2 14,8 20,8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10,9 9,9 8,9"></polyline>
                </svg>
                ORDER LIST
            </div>

            <div class="categories">
                <div class="categories-header">
                    Categories
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
                <div class="category-item">
                    Samsung
                    <span class="category-count">21</span>
                </div>
                <div class="category-item">
                    Iphone
                    <span class="category-count">32</span>
                </div>
                <div class="category-item">
                    MacBook
                    <span class="category-count">13</span>
                </div>
                <div class="category-item">
                    Mi NoteBook
                    <span class="category-count">14</span>
                </div>
                <div class="category-item">
                    MateBook
                    <span class="category-count">06</span>
                </div>
                <div class="category-item">
                    GalaxyBook
                    <span class="category-count">11</span>
                </div>
            </div>
        </div>

        <div class="content">
            <div class="content-header">
                <div class="breadcrumb">
                    <a href="#" onclick="goToAllProducts()">Home</a> > 
                    <a href="#" onclick="goToAllProducts()">All Products</a> > 
                    Add New Products
                </div>
                <h1 class="page-title">Add New Products</h1>
            </div>

            <form class="product-form" onsubmit="handleSubmit(event)">
                <div class="form-left">
                    <div class="form-group">
                        <label class="form-label">Product Name</label>
                        <input required type="text" class="form-input" placeholder="Type Name Here" id="productName">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea required class="form-input form-textarea" placeholder="Type Description Here" id="productDescription"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="camera">Camera</label>
                            <input required class="form-input" type="text" id="camera" placeholder="e.g., 48MP + 12MP">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="cpu">CPU</label>
                            <input required class="form-input" type="text" id="cpu" placeholder="e.g., Snapdragon 888">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="ram">RAM (GB)</label>
                            <input required class="form-input" type="number" id="ram" placeholder="8">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="rom">ROM (GB)</label>
                            <input required class="form-input" type="number" id="rom" placeholder="128">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="pin">Battery (mAh)</label>
                        <input required class="form-input" type="number" id="pin" placeholder="4000">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="pin">Thickness</label>
                            <input required class="form-input" type="number" id="thick" placeholder="4000">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="weight">Weight (g)</label>
                            <input required class="form-input" type="number" id="weight" placeholder="180">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="width">Width (mm)</label>
                            <input required class="form-input" type="number" id="width" placeholder="75.2" step="0.1">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="height">Height (mm)</label>
                            <input required class="form-input" type="number" id="height" placeholder="160.8" step="0.1">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">SKU</label>
                            <input required type="text" class="form-input" placeholder="#32A53" id="sku">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Stock Quantity</label>
                            <input required type="number" class="form-input" placeholder="21" id="stockQuantity">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Regular Price</label>
                            <input required type="number" class="form-input" placeholder="$192.00" id="regularPrice">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Sale Price</label>
                            <input required type="number" class="form-input" placeholder="$450" id="salePrice">
                        </div>
                    </div>

                    <!-- <div class="form-group">
                        <label class="form-label">Tag</label>
                        <div class="tags-container" id="tagsContainer">
                            <span class="tag">
                                Samsung
                                <button type="button" class="tag-remove" onclick="removeTag(this)">×</button>
                            </span>
                            <span class="tag">
                                Gamepad
                                <button type="button" class="tag-remove" onclick="removeTag(this)">×</button>
                            </span>
                            <span class="tag">
                                Havic
                                <button type="button" class="tag-remove" onclick="removeTag(this)">×</button>
                            </span>
                            <span class="tag">
                                PS5
                                <button type="button" class="tag-remove" onclick="removeTag(this)">×</button>
                            </span>
                        </div>
                        <input type="text" class="form-input" placeholder="Add new tag" id="newTag" style="margin-top: 0.5rem;" onkeypress="addTag(event)">
                    </div> -->
                </div>

                 <div class="form-right">
                    <div class="product-image">
                        <div class="image-preview-grid" id="imagePreviewGrid">
                            <div class="no-images">No images selected</div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Product Gallery</label>
                        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                            <div class="upload-icon">📷</div>
                            <div>Drop your images here, or browse</div>
                            <small>Jpeg, png are allowed</small>
                        </div>
                        <input type="file" id="fileInput" multiple accept="image/*" style="display: none;" onchange="handleFileUpload(event)">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="cancelForm()">CANCEL</button>
                    <button type="submit" class="btn btn-primary">ADD</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function logout() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = 'Login.html';
            
        }
        let selectedImages = [];

        function removeImage(index) {
            selectedImages.splice(index, 1);
            updateImagePreview();
        }

        function updateImagePreview() {
            const previewGrid = document.getElementById('imagePreviewGrid');
            
            if (selectedImages.length === 0) {
                previewGrid.innerHTML = '<div class="no-images">No images selected</div>';
                return;
            }

            previewGrid.innerHTML = '';
            selectedImages.forEach((imageData, index) => {
                const previewItem = document.createElement('div');
                previewItem.className = 'preview-item';
                previewItem.innerHTML = `
                    <img src="${imageData.url}" alt="Preview ${index + 1}">
                    <button class="remove-image" onclick="removeImage(${index})" title="Remove image">×</button>
                `;
                previewGrid.appendChild(previewItem);
            });
        }

        function handleFileUpload(event) {
            const files = Array.from(event.target.files);
            
            files.forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        selectedImages.push({
                            file: file,
                            url: e.target.result,
                            name: file.name
                        });
                        updateImagePreview();
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            // Clear the input to allow selecting the same files again
            event.target.value = '';
        }

        async function handleSubmit(event) {
            event.preventDefault();
            const token = localStorage.getItem("access_token");

            try {
                 let uploadedImages = [];

                // Step 01: Upload each selected image to MinIO
                console.log(selectedImages.length, selectedImages)
                if (selectedImages.length==0){
                    alert("No image found!");
                    window.location.href = "AdminProductDashboard.html"; 
                    return
                }
                for (let file of selectedImages) {
                    // 3.1 Get presigned upload URL
                    const uploadUrlRes = await fetch(`http://localhost:8000/api/products/get-upload-url?filename=${encodeURIComponent(file.name)}`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        },
                    });
                    if (!uploadUrlRes.ok) throw new Error("Failed to get upload URL");
                    const { upload_url, object_path } = await uploadUrlRes.json();
                    console.log(upload_url)
                    // 3.2 Upload file to MinIO
                    const uploadRes = await fetch(upload_url, {
                        method: 'PUT',
                        body: file.file
                    });
                    if (!uploadRes.ok) throw new Error(`Upload failed for ${file.name}`);

                    uploadedImages.push({ path: object_path });

                    console.log(`📤 Uploaded ${file.name} to MinIO`);
                }
                // Step 2: Upload Product with image paths
                const payload = {
                    name: document.getElementById('productName').value,
                    description: document.getElementById('productDescription').value,
                    quantity: parseInt(document.getElementById('stockQuantity').value),
                    sku: document.getElementById('sku').value,
                    cost_price: parseFloat(document.getElementById('regularPrice').value),
                    sale_price: parseFloat(document.getElementById('salePrice').value),
                    camera: document.getElementById('camera').value,
                    cpu: document.getElementById('cpu').value,
                    ram: parseInt(document.getElementById('ram').value),
                    rom: parseInt(document.getElementById('rom').value),
                    pin: document.getElementById('pin').value,
                    thick: parseFloat(document.getElementById('thick').value),
                    weight: parseFloat(document.getElementById('weight').value),
                    width: parseFloat(document.getElementById('width').value),
                    height: parseFloat(document.getElementById('height').value),
                    images: uploadedImages
                };

                const createRes = await fetch(`http://localhost:8000/api/products/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });

                if (!createRes.ok) throw new Error("Failed to create product");

                const newProduct = await createRes.json();
                console.log("✅ Product created:", newProduct);

                alert("🎉 Product added successfully!");
                window.location.href = "AdminProductDashboard.html"; // redirect to product list

            } catch (err) {
                console.error(err);
                alert("❌ Error: " + err.message);
            }
        }

        function cancelForm() {
            if (confirm('Cancel adding product?')) {
                window.location.href = "AdminProductDashboard.html";
            }
        }
    </script>
</body>
</html>
