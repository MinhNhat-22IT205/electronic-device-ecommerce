<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive - Product Store</title>
    <link rel="stylesheet" href="product-list.css">
</head>

<body>
    <header class="header">
        <div class="nav-container">
            <div class="logo">Exclusive</div>
            <nav class="nav-links">
                <a href="#">Home</a>
                <a href="#">Shop</a>
                <a href="#">Contact</a>
            </nav>
            <div class="header-actions">
                <div class="search-bar">
                    <input type="text" placeholder="What are you looking for?" id="searchInput">
                    <button onclick="searchProducts()">🔍</button>
                </div>
                <div class="cart-icon">
                    🛒
                    <span class="cart-count" id="cartCount">0</span>
                </div>
                <div class="cart-icon">3</div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="filter-header">
                <span>Filter</span>
            </div>
            <div class="categories">
                <h3>Categories</h3>
                <ul class="category-list">
                    <li class="active" onclick="filterByCategory('all')">All Products</li>
                    <li onclick="filterByCategory('Samsung')">Samsung</li>
                    <li onclick="filterByCategory('iPhone')">iPhone</li>
                    <li onclick="filterByCategory('Galaxy')">Galaxy</li>
                    <li onclick="filterByCategory('MacBook')">MacBook</li>
                    <li onclick="filterByCategory('Gaming')">Gaming</li>
                    <li onclick="filterByCategory('Accessories')">Accessories</li>
                </ul>
            </div>
        </aside>

        <main class="content">
            <div class="product-header">
                <h1 class="product-title">Products</h1>
                <div class="sort-dropdown">
                    <button class="sort-btn" onclick="toggleSortDropdown()">
                        Sort by <span id="currentSort">Newest</span> ▼
                    </button>
                    <div class="sort-options" id="sortOptions">
                        <div class="sort-option" onclick="sortProducts('newest')">Newest</div>
                        <div class="sort-option" onclick="sortProducts('price_low')">High to Low (Price)</div>
                        <div class="sort-option" onclick="sortProducts('price_high')">Low to High (Price)</div>
                    </div>
                </div>
            </div>

            <div class="products-grid" id="productsGrid">
                <!-- Products will be loaded here -->
            </div>

            <div class="pagination" id="paginationContainer"></div>
        </main>
    </div>

    <script>
        let productsData = [];
        let currentProducts = [];
        let cartItems = 0;

        // State for query params
        let currentPage = 1;
        let limit = 10;
        let currentCategory = "";
        let currentSort = "newest"; // newest, price-low, price-high
        let currentSearch = "";

        async function fetchProducts() {
            try {
                const url = new URL("http://localhost:8000/api/products");
                url.searchParams.append("page", currentPage);
                url.searchParams.append("limit", limit);
                if (currentSort) {
                    url.searchParams.append("sort", currentSort);
                }
                if (currentSearch) {
                    url.searchParams.append("search", currentSearch);
                }

                const res = await fetch(url);
                if (!res.ok) throw new Error("Failed to fetch products");

                const data = await res.json();
                productsData = data.data.map(p => ({
                    id: p.id,
                    name: p.name,
                    currentPrice: p.sale_price,
                    originalPrice: p.cost_price,
                    images: p.images?.map(img => img.path) ?? ["placeholder.jpg"],
                    discount: Math.round(((p.cost_price - p.sale_price) / p.cost_price) * 100)
                }));

                currentProducts = [...productsData];
                renderProducts(currentProducts);
                renderPagination(data.pagination);
            } catch (err) {
                console.error(err);
            }
        }

        // Image carousel state
        let productImageState = {};

        function nextImage(productId) {
            let state = productImageState[productId];
            if (!state) return;
            state.currentIndex = (state.currentIndex + 1) % state.images.length;
            document.getElementById(`product-img-${productId}`).src = state.images[state.currentIndex];
        }

        function prevImage(productId) {
            let state = productImageState[productId];
            if (!state) return;
            state.currentIndex = (state.currentIndex - 1 + state.images.length) % state.images.length;
            document.getElementById(`product-img-${productId}`).src = state.images[state.currentIndex];
        }

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            products.forEach(product => {
                let images = product.images;
                const productId = product.id;

                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <div class="discount-badge">-${product.discount}%</div>
                    <div class="product-image">
                        <button class="img-nav prev" onclick="prevImage(${productId})">❮</button>
                        <img id="product-img-${productId}" src="${images[0]}" alt="${product.name}">
                        <button class="img-nav next" onclick="nextImage(${productId})">❯</button>
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">${product.name}</h3>
                        <div class="product-price">
                            <span class="current-price">$${product.currentPrice}</span>
                            <span class="original-price">$${product.originalPrice}</span>
                        </div>
                        <button class="add-to-cart" onclick="addToCart(${product.id})">Add To Cart</button>
                    </div>
                `;

                productImageState[productId] = { images, currentIndex: 0 };

                grid.appendChild(productCard);
            });
        }

        function filterByCategory(category) {
            document.querySelectorAll('.category-list li').forEach(li => li.classList.remove('active'));
            event.target.classList.add('active');
            currentCategory = category;
            currentPage = 1;
            fetchProducts();
        }

        function toggleSortDropdown() {
            document.getElementById('sortOptions').classList.toggle('show');
        }

        function sortProducts(type) {
            currentSort = type;
            const sortLabel = document.getElementById('currentSort');
            if (type === 'newest') {
                sortLabel.textContent = 'Newest';
            } else if (type === 'price-low') {
                sortLabel.textContent = 'High to Low (Price)';
            } else if (type === 'price-high') {
                sortLabel.textContent = 'Low to High (Price)';
            }
            fetchProducts();
        }

        function searchProducts() {
            currentSearch = document.getElementById('searchInput').value.trim();
            currentPage = 1;
            fetchProducts();
        }

        function addToCart(productId) {
            cartItems++;
            document.getElementById('cartCount').textContent = cartItems;
        }

        function renderPagination(pagination) {
            const container = document.querySelector('.pagination');
            container.innerHTML = '';
            for (let i = 1; i <= pagination.pages; i++) {
                const btn = document.createElement('div');
                btn.className = `page-btn ${i === pagination.page ? 'active' : ''}`;
                btn.textContent = i;
                btn.onclick = () => {
                    currentPage = i;
                    fetchProducts();
                };
                container.appendChild(btn);
            }
        }

        document.addEventListener('click', function (event) {
            const dropdown = document.getElementById('sortOptions');
            const sortBtn = document.querySelector('.sort-btn');
            if (!dropdown.contains(event.target) && !sortBtn.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });

        document.getElementById('searchInput').addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                searchProducts();
            }
        });

        fetchProducts();
    </script>

</body>

</html>
